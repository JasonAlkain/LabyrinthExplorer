name: Windows build and itch.io release

on:
  push:
    branches: [master, testing]
  pull_request:
    branches: [master, testing]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore LabyrinthExplorer.sln
      - name: Build solution
        run: dotnet build LabyrinthExplorer.sln -c Release --no-restore
      - name: Run tests
        run: dotnet test LabyrinthExplorer.Tests/LabyrinthExplorer.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory "${{ runner.temp }}/results"
      - name: Verify test discovery
        run: |
          [xml]$report = Get-Content -Raw "$env:RUNNER_TEMP/results/tests.trx"
          if ([int]$report.TestRun.ResultSummary.Counters.passed -lt 1) {
            throw 'No passing tests were recorded.'
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/results/*.trx
      - name: Publish Windows x64
        run: |
          dotnet publish LabyrinthExplorer.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/windows"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item LICENSE "$env:RUNNER_TEMP/windows"
      - uses: actions/upload-artifact@v4
        with:
          name: LabyrinthExplorer-win-x64
          path: ${{ runner.temp }}/windows/
          if-no-files-found: error

  itch:
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    concurrency: itch-windows-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LabyrinthExplorer-win-x64
          path: game
      - name: Install Butler
        run: |
          curl --fail --location --retry 3 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
      - name: Push Windows build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          : "${BUTLER_API_KEY:?Configure the BUTLER_API_KEY Actions secret for this repository}"
          "$RUNNER_TEMP/butler/butler" push game alkain-studios-llc/cs-labyrinth-explorer:windows --userversion "$RELEASE_TAG"
